<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سرویس اولیا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            overflow: hidden;
            position: relative;
        }

        /* ===== پس‌زمینه ستاره‌دار ===== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== شهاب‌ها ===== */
        .shooting-star {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.5);
            animation: shoot linear infinite;
            z-index: 0;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 1.5px;
            background: linear-gradient(to left, rgba(255,255,255,0.8), transparent);
            right: 100%;
        }

        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
            5% { opacity: 1; }
            20% { opacity: 1; }
            30% { opacity: 0; transform: translate(-400px, 280px) rotate(-35deg); }
            100% { opacity: 0; }
        }

        /* ===== کارت اصلی ===== */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 60px 50px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeUp 1s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ======= عنوان "سرویس من (اولیا)" ======= */
        .service-title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(100, 150, 255, 0.3);
        }

        .service-title span {
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub-title {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* ======= خط جداکننده ======= */
        .divider {
            width: 70px;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
            margin: 0 auto 35px;
        }

        /* ======= وضعیت API ======= */
        .api-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px 30px;
            background: rgba(255, 70, 70, 0.08);
            border: 1px solid rgba(255, 70, 70, 0.2);
            border-radius: 60px;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        .api-status .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            box-shadow: 0 0 20px rgba(255, 70, 70, 0.6);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .api-status .api-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ff6b7a;
            letter-spacing: 1px;
        }

        .api-status .api-text .highlight {
            color: #ff4757;
            font-weight: 800;
        }

        /* ======= پیام خطا ======= */
        .error-msg {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 20px;
            letter-spacing: 0.5px;
        }

        .error-msg code {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.04);
        }

        /* ======= دکمه ریترای ======= */
        .retry-btn {
            margin-top: 30px;
            padding: 12px 40px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
        }

        /* ======= ریسپانسیو ======= */
        @media (max-width: 600px) {
            .card { padding: 40px 25px; }
            .service-title { font-size: 1.8rem; }
            .api-status .api-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- ===== ستاره‌ها (JS تولید می‌کنه) ===== -->
    <div class="stars" id="starsContainer"></div>

    <!-- ===== شهاب‌ها ===== -->
    <div class="shooting-star" style="top:10%; left:80%; animation-duration:6s; animation-delay:0s;"></div>
    <div class="shooting-star" style="top:20%; left:60%; animation-duration:8s; animation-delay:3s;"></div>
    <div class="shooting-star" style="top:5%; left:90%; animation-duration:7s; animation-delay:5s;"></div>
    <div class="shooting-star" style="top:15%; left:50%; animation-duration:9s; animation-delay:2s;"></div>
    <div class="shooting-star" style="top:25%; left:70%; animation-duration:5.5s; animation-delay:7s;"></div>

    <!-- ===== کارت اصلی ===== -->
    <div class="card">

        <!-- عنوان "سرویس من (اولیا)" -->
        <div class="service-title">
            سرویس من <span>(اولیا)</span>
        </div>
        <div class="sub-title">●  سرویس اختصاصی  ●</div>

        <div class="divider"></div>

        <!-- وضعیت API -->
        <div class="api-status">
            <span class="dot"></span>
            <span class="api-text">
                <span class="highlight">API</span> در دسترس نیست
            </span>
        </div>

        <div class="error-msg">
            <code>❌ 503 Service Unavailable</code>
            <br><br>
            لطفاً بعداً مجدداً تلاش کنید
        </div>

        <button class="retry-btn" onclick="this.innerText='در حال تلاش...'; setTimeout(()=>this.innerText='تلاش مجدد', 1200);">
            ↻  تلاش مجدد
        </button>
    </div>

    <script>
        // ===== تولید ستاره‌ها =====
        const container = document.getElementById('starsContainer');
        const starCount = 280;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(star);
        }
    </script>

</body>
</html>
